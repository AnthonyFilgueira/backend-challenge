name: Temporary extract ClinicSay challenge brief

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/extract-original-brief.yml"

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Extract PDF text
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          pdfinfo enunciado.pdf
          pdftotext -layout -enc UTF-8 enunciado.pdf enunciado-extracted.txt
          test -s enunciado-extracted.txt

      - name: Upload extracted text for review
        uses: actions/upload-artifact@v4
        with:
          name: clinicsay-enunciado-extracted
          path: |
            enunciado-extracted.txt
            enunciado.pdf
          if-no-files-found: error
          retention-days: 1
