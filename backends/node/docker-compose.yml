services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clinicsay
      POSTGRES_USER: clinicsay
      POSTGRES_PASSWORD: clinicsay
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U clinicsay -d clinicsay"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5433:5432"
  provider:
    build:
      context: ../../provider
    dockerfile: Dockerfile
    ports:
      - "4000:4000"
  api:
    build: .
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgres://clinicsay:clinicsay@db:5432/clinicsay
      PROVIDER_URL: http://provider:4000
      CLOCK_MODE: test
    depends_on:
      db:
        condition: service_healthy
      provider:
        condition: service_started
    ports:
      - "3000:3000"
