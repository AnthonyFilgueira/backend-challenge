services:
  api:
    build: .
    ports: ["3000:3000"]
    environment:
      APP_ENV: local
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: clinicsay
      DB_USERNAME: clinicsay
      DB_PASSWORD: clinicsay_local
      PROVIDER_URL: http://provider:4010
      CLOCK_MODE: test
    depends_on:
      postgres: {condition: service_healthy}
      provider: {condition: service_started}
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: clinicsay
      POSTGRES_USER: clinicsay
      POSTGRES_PASSWORD: clinicsay_local
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U clinicsay -d clinicsay"]
      interval: 5s
      timeout: 3s
      retries: 20
  provider:
    build: ../../provider
    ports: ["4010:4010"]
